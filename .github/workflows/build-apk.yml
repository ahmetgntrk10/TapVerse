name: APK olustur

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'db/**']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Paketleri kur
        run: npm install

      - name: Oyun dosyalarini hazirla (internetsiz calissin)
        run: |
          mkdir -p www
          cp docs/index.html www/index.html
          cp node_modules/three/build/three.module.js www/three.module.js
          sed -i 's#https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js#./three.module.js#' www/index.html

      - name: Android projesi
        run: |
          npx cap add android
          npx cap sync android
          sed -i 's#<activity#<activity android:screenOrientation="portrait"#' android/app/src/main/AndroidManifest.xml

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: TapVerse-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
