name: APK olustur

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'db/**', 'docs/version.json', 'docs/admin.html']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Paketleri kur
        run: npm install

      - name: Oyun dosyalarini hazirla (internetsiz calissin)
        run: |
          mkdir -p www
          cp docs/index.html www/index.html
          cp node_modules/three/build/three.module.js www/three.module.js
          sed -i 's#https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js#./three.module.js#' www/index.html

      - name: Android projesi
        run: |
          npx cap add android
          npx cap sync android
          sed -i 's#<activity#<activity android:screenOrientation="portrait"#' android/app/src/main/AndroidManifest.xml

      - name: Ikon ve titresim izni
        run: |
          R=android/app/src/main/res
          for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            n=${d%%:*}; r=${d#*:}; l=${r%%:*}; f=${r#*:}
            cp icon/legacy-$l.png $R/mipmap-$n/ic_launcher.png
            cp icon/round-$l.png $R/mipmap-$n/ic_launcher_round.png
            cp icon/fg-$f.png $R/mipmap-$n/ic_launcher_foreground.png
          done
          mkdir -p $R/drawable && cp icon/stat.png $R/drawable/ic_stat_tv.png
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="ic_launcher_background">#1B1045</color></resources>\n' > $R/values/ic_launcher_background.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.VIBRATE"/><application#' android/app/src/main/AndroidManifest.xml

      - name: Surum numarasi (her derlemede artar)
        run: |
          python3 - <<'PY'
          import re
          p='android/app/build.gradle'
          s=open(p).read()
          s=re.sub(r'versionCode\s+\d+','versionCode ${{ github.run_number }}',s)
          s=re.sub(r'versionName\s+"[^"]*"','versionName "1.0.${{ github.run_number }}"',s)
          open(p,'w').write(s)
          PY
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Imza anahtari (varsa)
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -n "$KS" ] && [ -n "$KS_PASS" ]; then
            echo "$KS" | base64 -d > android/tapverse.jks
            python3 - <<'PY'
          p='android/app/build.gradle'
          s=open(p).read()
          assert 'buildTypes {' in s and 'minifyEnabled false' in s
          s=s.replace('buildTypes {',"signingConfigs {\n        release {\n            storeFile file('../tapverse.jks')\n            storePassword System.getenv('KS_PASS')\n            keyAlias 'tapverse'\n            keyPassword System.getenv('KS_PASS')\n        }\n    }\n    buildTypes {",1)
          s=s.replace('minifyEnabled false','minifyEnabled false\n            signingConfig signingConfigs.release',1)
          open(p,'w').write(s)
          PY
            echo "SIGNED=1" >> $GITHUB_ENV
          else
            echo "Imza anahtari yok: test (debug) APK uretilecek"
          fi

      - name: APK ve AAB derle
        working-directory: android
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          chmod +x gradlew
          if [ "$SIGNED" = "1" ]; then
            ./gradlew assembleRelease bundleRelease
          else
            ./gradlew assembleDebug
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: TapVerse-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: env.SIGNED == '1'
        with:
          name: TapVerse-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
