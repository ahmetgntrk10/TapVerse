<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TapVerse</title>
<style>
html,body{margin:0;height:100%;background:#0b0f1a;color:#fff;font-family:sans-serif;overflow:hidden;touch-action:none;user-select:none}
canvas{display:block}
#ui{position:fixed;top:12px;left:0;right:0;text-align:center;font-size:30px;font-weight:bold;pointer-events:none;text-shadow:0 2px 6px #000}
#msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000a;font-size:22px;text-align:center;line-height:1.5}
#msg b{font-size:42px;margin-bottom:10px}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
</head>
<body>
<div id="ui">0</div>
<div id="msg"><b>TapVerse</b>Başlamak için dokun<br><small>Sağa / sola kaydır: şerit değiştir<br>Yukarı kaydır: zıpla · Aşağı: kay</small></div>
<script type="module">
import * as THREE from 'three';

const ui=document.getElementById('ui'),msg=document.getElementById('msg');
const LANES=[-2.2,0,2.2];
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x2a1f5c);
scene.fog=new THREE.Fog(0x2a1f5c,22,65);
const camera=new THREE.PerspectiveCamera(60,1,0.1,100);
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

scene.add(new THREE.HemisphereLight(0xb9a7ff,0x3a3a66,1.0));
const sun=new THREE.DirectionalLight(0xffffff,0.9);
sun.position.set(5,12,6);sun.castShadow=true;
sun.shadow.camera.left=-8;sun.shadow.camera.right=8;sun.shadow.camera.top=12;sun.shadow.camera.bottom=-12;
scene.add(sun);scene.add(sun.target);

// ---- Yol (kayan çizgilerle) ----
const road=new THREE.Mesh(new THREE.PlaneGeometry(7.4,200),new THREE.MeshLambertMaterial({color:0x4a4a68}));
road.rotation.x=-Math.PI/2;road.position.z=-80;road.receiveShadow=true;scene.add(road);
const side=new THREE.Mesh(new THREE.PlaneGeometry(60,200),new THREE.MeshLambertMaterial({color:0x1b5e5a}));
side.rotation.x=-Math.PI/2;side.position.set(0,-0.02,-80);scene.add(side);
const dashes=[];
const dashMat=new THREE.MeshBasicMaterial({color:0x80deea});
for(let i=0;i<30;i++)for(const x of [-1.1,1.1]){
  const d=new THREE.Mesh(new THREE.PlaneGeometry(0.12,1.6),dashMat);
  d.rotation.x=-Math.PI/2;d.position.set(x,0.01,-i*4+10);scene.add(d);dashes.push(d);
}
// kenar ağaçları
const trees=[];
function makeTree(){
  const g=new THREE.Group();
  const t=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.2,1.2),new THREE.MeshLambertMaterial({color:0x7a4a21}));t.position.y=0.6;
  const l=new THREE.Mesh(new THREE.ConeGeometry(0.9,2.2,8),new THREE.MeshLambertMaterial({color:0x7e57c2,emissive:0x311b92}));l.position.y=2.2;
  t.castShadow=l.castShadow=true;g.add(t,l);return g;
}
for(let i=0;i<24;i++){
  const t=makeTree();t.position.set((i%2?1:-1)*(5+Math.random()*4),0,-i*4.5+8);scene.add(t);trees.push(t);
}

// ---- Karakter (daha insansı: yuvarlak uzuvlar, diz-dirsek, saç, yüz, çanta) ----
const mat=(c,o={})=>new THREE.MeshLambertMaterial(Object.assign({color:c},o));
const SKIN=0xf1c27d,SHIRT=0xff7043,JEANS=0x283593,SHOE=0xfafafa,HAIR=0x3e2723;
const player=new THREE.Group();
const rig=new THREE.Group();rig.position.y=0.95;player.add(rig);   // kalça noktası
const cast=m=>{m.castShadow=true;return m};
function cap(r,len,color){return cast(new THREE.Mesh(new THREE.CapsuleGeometry(r,len,6,12),mat(color)))}
function ball(r,color){return cast(new THREE.Mesh(new THREE.SphereGeometry(r,16,12),mat(color)))}
// gövde
const torso=cap(0.27,0.42,SHIRT);torso.position.y=0.55;torso.scale.z=0.78;rig.add(torso);
const stripe=cast(new THREE.Mesh(new THREE.CylinderGeometry(0.285,0.285,0.1,16),mat(0xffffff)));
stripe.position.y=0.55;stripe.scale.z=0.78;rig.add(stripe);
const hips=cap(0.25,0.06,JEANS);hips.position.y=0.06;hips.rotation.z=Math.PI/2;hips.scale.set(1,1,0.8);rig.add(hips);
// boyun + kafa
const neck=cast(new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.1,0.14,10),mat(SKIN)));neck.position.y=1.0;rig.add(neck);
const headG=new THREE.Group();headG.position.y=1.28;rig.add(headG);
const head=ball(0.26,SKIN);head.scale.set(0.95,1.05,1);headG.add(head);
const hair=ball(0.275,HAIR);hair.scale.set(1,0.95,1);hair.position.set(0,0.06,-0.05);headG.add(hair);
const fringe=ball(0.2,HAIR);fringe.scale.set(1.1,0.45,0.7);fringe.position.set(0,0.2,0.1);headG.add(fringe);
for(const x of[-0.09,0.09]){const e=ball(0.035,0x111111);e.position.set(x,0.02,0.24);headG.add(e)}
const nose=ball(0.03,0xe0a96d);nose.position.set(0,-0.04,0.26);headG.add(nose);
for(const x of[-0.27,0.27]){const ear=ball(0.055,SKIN);ear.position.set(x,0,0);headG.add(ear)}
// sırt çantası (kamera arkadan gördüğü için güzel durur)
const pack=cast(new THREE.Mesh(new THREE.BoxGeometry(0.42,0.55,0.22),mat(0x1565c0)));pack.position.set(0,0.55,-0.28);rig.add(pack);
const packTop=cast(new THREE.Mesh(new THREE.BoxGeometry(0.34,0.14,0.2),mat(0x0d47a1)));packTop.position.set(0,0.88,-0.28);rig.add(packTop);
// kol: omuz -> dirsek -> el
function makeArm(x){
  const sh=new THREE.Group();sh.position.set(x,0.84,0);rig.add(sh);
  const j=ball(0.14,SHIRT);sh.add(j);
  const up=cap(0.09,0.3,SHIRT);up.position.y=-0.22;sh.add(up);
  const el=new THREE.Group();el.position.y=-0.46;sh.add(el);
  const lo=cap(0.075,0.26,SKIN);lo.position.y=-0.2;el.add(lo);
  const hand=ball(0.09,SKIN);hand.position.y=-0.4;el.add(hand);
  return{sh,el};
}
// bacak: kalça -> diz -> ayak
function makeLeg(x){
  const hip=new THREE.Group();hip.position.set(x,0.05,0);rig.add(hip);
  const th=cap(0.12,0.4,JEANS);th.position.y=-0.3;hip.add(th);
  const kn=new THREE.Group();kn.position.y=-0.6;hip.add(kn);
  const sh=cap(0.1,0.38,JEANS);sh.position.y=-0.27;kn.add(sh);
  const shoe=cast(new THREE.Mesh(new THREE.BoxGeometry(0.2,0.14,0.36),mat(SHOE)));shoe.position.set(0,-0.55,0.06);kn.add(shoe);
  const sole=cast(new THREE.Mesh(new THREE.BoxGeometry(0.21,0.05,0.37),mat(0xe53935)));sole.position.set(0,-0.63,0.06);kn.add(sole);
  return{hip,kn};
}
const AL=makeArm(-0.33),AR=makeArm(0.33),LL=makeLeg(-0.16),LR=makeLeg(0.16);
player.rotation.y=Math.PI; // yüz ileri baksın
scene.add(player);

// ---- Oyun durumu ----
let state='menu',lane=1,targetX=0,vy=0,y=0,sliding=0,speed=14,score=0,spawnZ=0,t=0,best=+localStorage.getItem('tv_best3d')||0;
let obstacles=[];
const bx=(w,h,d,c,x=0,y=0,z=0)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);m.castShadow=true;return m};
const cyl=(r,h,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,12),mat(c));m.position.set(x,y,z);m.castShadow=true;return m};
const sph=(r,c,x,y,z,emis)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(r,12,10),new THREE.MeshLambertMaterial({color:c,emissive:emis||0x000000}));m.position.set(x,y,z);return m};
const STONE=0x8d93a8;
const cone=(r,h,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.ConeGeometry(r,h,6),mat(c));m.position.set(x,y,z);m.castShadow=true;return m};
// Diken tuzağı (zıpla)
function makeSpikes(){
  const g=new THREE.Group();
  g.add(bx(1.8,0.12,0.95,0x4a4e69,0,0.06,0));
  for(let i=0;i<5;i++)for(let j=0;j<2;j++){
    g.add(cone(0.13,0.75,0xcfd8dc,-0.72+i*0.36,0.5,-0.22+j*0.44));
    g.add(cone(0.05,0.2,0xef5350,-0.72+i*0.36,0.84,-0.22+j*0.44));
  }
  g.userData={hw:0.95,d:0.5,y0:0,y1:0.9};return g;
}
// Yuvarlanan kütük (zıpla)
function makeLog(){
  const g=new THREE.Group();
  const l=cyl(0.46,1.9,0x8d5a2b,0,0.46,0);l.rotation.z=Math.PI/2;g.add(l);
  for(const x of[-0.96,0.96]){const e=cyl(0.4,0.04,0xd7b377,x,0.46,0);e.rotation.z=Math.PI/2;g.add(e);
    const r=cyl(0.22,0.05,0xa9743a,x*1.01,0.46,0);r.rotation.z=Math.PI/2;g.add(r)}
  g.add(bx(1.2,0.1,0.5,0x66bb6a,-0.1,0.9,0));
  g.add(bx(0.3,0.3,0.3,0x6d6f80,-0.7,0.15,0.5),bx(0.3,0.3,0.3,0x6d6f80,0.7,0.15,0.5));
  g.userData={hw:0.95,d:0.5,y0:0,y1:0.95};return g;
}
// Antik taş kemer (altından kay)
function makeArch(){
  const g=new THREE.Group();
  for(const x of[-1.0,1.0]){g.add(bx(0.4,2.5,0.55,STONE,x,1.25,0));g.add(bx(0.5,0.2,0.65,0x6d7289,x,0.1,0));g.add(bx(0.5,0.2,0.65,0x6d7289,x,2.5,0))}
  g.add(bx(2.4,0.45,0.55,STONE,0,2.55,0));
  const rune=new THREE.Mesh(new THREE.BoxGeometry(1.7,0.55,0.18),new THREE.MeshLambertMaterial({color:0x4dd0e1,emissive:0x00acc1}));
  rune.position.set(0,1.85,0);g.add(rune);
  for(const x of[-0.6,0.6])g.add(cyl(0.02,0.3,0x424242,x,2.2,0));
  for(let k=0;k<3;k++)g.add(bx(0.12,0.3,0.2,0xe0f7fa,-0.5+k*0.5,1.85,0.01));
  g.userData={hw:1.1,d:0.3,y0:1.45,y1:2.8};return g;
}
// Parlayan kristal kümesi (yan şeride geç)
function makeCrystal(){
  const g=new THREE.Group();
  const cm=c=>new THREE.MeshLambertMaterial({color:c,emissive:0x4a148c,flatShading:true});
  const big=new THREE.Mesh(new THREE.ConeGeometry(0.6,3.2,5),cm(0x9575cd));big.position.y=1.6;big.castShadow=true;g.add(big);
  for(const [x,h,r,rz] of [[-0.6,2.1,0.38,0.25],[0.6,1.8,0.34,-0.3],[0.15,1.3,0.3,0.1]]){
    const c=new THREE.Mesh(new THREE.ConeGeometry(r,h,5),cm(0xb39ddb));c.position.set(x,h/2,x>0?0.3:-0.3);c.rotation.z=rz;c.castShadow=true;g.add(c);
  }
  for(const [x,z,r] of [[-0.7,0.3,0.3],[0.7,-0.2,0.28],[0,0.5,0.25]]){
    const k=new THREE.Mesh(new THREE.DodecahedronGeometry(r),mat(0x5c6078,{flatShading:true}));k.position.set(x,r*0.6,z);g.add(k);
  }
  g.userData={hw:0.95,d:0.8,y0:0,y1:3.2};return g;
}
const MAKERS=[makeSpikes,makeLog,makeArch,makeCrystal];
function spawnRow(z){
  const free=Math.floor(Math.random()*3);
  for(let l=0;l<3;l++){
    if(l===free||Math.random()<0.35)continue;
    const r=Math.random();
    const k=r<0.22?0:r<0.42?1:r<0.68?2:3;
    const m=MAKERS[k]();
    m.position.set(LANES[l],0,z);m.userData.l=l;
    scene.add(m);obstacles.push(m);
  }
}
function reset(){
  obstacles.forEach(o=>scene.remove(o));obstacles=[];
  lane=1;targetX=0;player.position.set(0,0,0);y=0;vy=0;sliding=0;speed=14;score=0;spawnZ=-30;
  for(let i=0;i<6;i++){spawnRow(spawnZ);spawnZ-=16}
}
function start(){reset();state='run';msg.style.display='none';last=performance.now()}
function die(){
  state='over';const s=Math.floor(score);
  if(s>best){best=s;try{localStorage.setItem('tv_best3d',best)}catch(e){}}
  msg.innerHTML='<b>Bitti</b>Puan: '+s+'<br>En iyi: '+best+'<br><br><small>Tekrar için dokun</small>';
  msg.style.display='flex';
}

// ---- Kontroller ----
function moveLane(d){if(state!=='run')return;lane=Math.max(0,Math.min(2,lane+d));targetX=LANES[lane]}
function jump(){if(state==='run'&&y<=0.001){vy=9;sliding=0}}
function slide(){if(state==='run'){sliding=0.7;if(y>0)vy=-14}}
let sx=0,sy=0,sdone=false;
addEventListener('pointerdown',e=>{
  if(state!=='run'){if(state==='menu'||state==='over'){start()}return}
  sx=e.clientX;sy=e.clientY;sdone=false;
});
addEventListener('pointermove',e=>{
  if(state!=='run'||sdone)return;
  const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.abs(dx)<30&&Math.abs(dy)<30)return;
  sdone=true;
  if(Math.abs(dx)>Math.abs(dy))moveLane(dx>0?1:-1);
  else if(dy<0)jump();else slide();
});
addEventListener('keydown',e=>{
  if(state!=='run'){if(e.code==='Space'||e.code==='Enter')start();return}
  if(e.code==='ArrowLeft'||e.code==='KeyA')moveLane(-1);
  if(e.code==='ArrowRight'||e.code==='KeyD')moveLane(1);
  if(e.code==='ArrowUp'||e.code==='Space'||e.code==='KeyW')jump();
  if(e.code==='ArrowDown'||e.code==='KeyS')slide();
});

// ---- Döngü ----
let last=performance.now();
function animateRunner(dt,running){
  t+=dt*(running?9+speed*0.15:0);
  const k=Math.min(1,dt*14);
  const air=y>0.01,sl=sliding>0;
  let hipL,hipR,knL,knR,aL,aR,eL,eR,lean=0.12,lift=0;
  if(sl){hipL=-1.25;hipR=-1.15;knL=2.1;knR=2.0;aL=-0.9;aR=-0.9;eL=-0.9;eR=-0.9;lean=0.55;lift=-0.3}
  else if(air){hipL=-0.9;hipR=0.5;knL=0.4;knR=1.2;aL=-2.4;aR=-2.0;eL=-0.3;eR=-0.3;lean=0.2}
  else{
    const s=Math.sin(t);
    hipL=s*0.95;hipR=-s*0.95;
    knL=Math.max(0,-Math.cos(t))*1.4+0.1;knR=Math.max(0,Math.cos(t))*1.4+0.1;
    aL=-s*0.9;aR=s*0.9;eL=-1.25;eR=-1.25;
    lift=Math.abs(Math.cos(t))*0.09;
    headG.rotation.x=Math.sin(t*2)*0.03;
  }
  const L=(o,v)=>o.rotation.x+=(v-o.rotation.x)*k;
  L(LL.hip,hipL);L(LR.hip,hipR);L(LL.kn,knL);L(LR.kn,knR);
  L(AL.sh,aL);L(AR.sh,aR);L(AL.el,eL);L(AR.el,eR);
  L(rig,lean);
  rig.position.y+=((0.95+lift)-rig.position.y)*k;
  // kayarken biraz alçal
  rig.position.y=sl?0.58:rig.position.y;
}
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min((now-last)/1000,0.05);last=now;
  if(state==='run'){
    speed=Math.min(14+score*0.02,40);   // zamanla hızlanır
    score+=speed*dt*0.7;                // hız arttıkça puan da artar
    // yatay hareket
    player.position.x+=(targetX-player.position.x)*Math.min(1,dt*14);
    // zıplama
    if(y>0||vy>0){vy-=26*dt;y+=vy*dt;if(y<=0){y=0;vy=0}}
    player.position.y=y;
    if(sliding>0)sliding-=dt;
    // dünya akışı
    const dz=speed*dt;
    obstacles.forEach(o=>o.position.z+=dz);
    obstacles=obstacles.filter(o=>{if(o.position.z>8){scene.remove(o);return false}return true});
    spawnZ+=dz;
    while(spawnZ>-90){spawnZ-=Math.max(11,18-speed*0.15);spawnRow(spawnZ+0)}
    dashes.forEach(d=>{d.position.z+=dz;if(d.position.z>12)d.position.z-=120});
    trees.forEach(tr=>{tr.position.z+=dz;if(tr.position.z>10)tr.position.z-=108});
    // çarpışma
    const px=player.position.x,pTop=y+(sliding>0?1.15:2.5),pBot=y;
    for(const o of obstacles){
      const u=o.userData;
      if(Math.abs(o.position.z)<u.d+0.25&&Math.abs(o.position.x-px)<u.hw-0.15){
        if(pBot<u.y1-0.05&&pTop>u.y0+0.05){die();break}
      }
    }
    ui.textContent=Math.floor(score);
  }
  animateRunner(dt,state==='run');
  // kamera
  camera.position.x+=((player.position.x*0.6)-camera.position.x)*Math.min(1,dt*6);
  camera.position.y=4.2;camera.position.z=7;
  camera.lookAt(camera.position.x*0.5,1.5,-6);
  sun.position.set(player.position.x+5,12,6);sun.target.position.set(player.position.x,0,0);
  renderer.render(scene,camera);
}
reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
