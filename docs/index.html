<style>
html,body{margin:0;height:100%;background:#0b0f1a;color:#fff;font-family:sans-serif;overflow:hidden;touch-action:none;user-select:none}
canvas{display:block}

#coinhud{position:fixed;top:14px;right:14px;font-size:22px;font-weight:bold;pointer-events:none;text-shadow:0 2px 6px #000;display:none}
.panel{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;line-height:1.5;font-size:20px}
.panel.dim{background:#000b}
.panel h1{font-size:48px;margin:0;text-shadow:0 3px 10px #000}
.panel h2{font-size:40px;margin:0}
.hidden{display:none!important}
button{font:inherit;font-weight:bold;color:#fff;background:#7c4dff;border:0;border-radius:14px;padding:14px 28px;min-width:220px;font-size:20px;box-shadow:0 4px 0 #4527a0;touch-action:manipulation}

button.alt{background:#37474f;box-shadow:0 4px 0 #1c262b}
button:disabled{opacity:.5}
.sheet{position:fixed;left:0;right:0;bottom:0;height:52vh;background:#141029f2;border-radius:22px 22px 0 0;padding:14px 14px 18px;box-sizing:border-box;display:flex;flex-direction:column}
.sheet .top{display:flex;justify-content:space-between;align-items:center;font-size:22px;font-weight:bold;margin-bottom:10px}
.sheet .top button{min-width:0;padding:8px 16px;font-size:16px}
#list{overflow-y:auto;flex:1}
.row{display:flex;align-items:center;gap:12px;background:#221b45;border-radius:14px;padding:10px 12px;margin-bottom:8px}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid #fff3;flex:none}
.row .nm{flex:1;font-size:18px;font-weight:bold}
.row button{min-width:110px;padding:9px 12px;font-size:16px}
.row.sel{outline:2px solid #69f0ae}
#pw{position:fixed;top:50px;right:14px;text-align:right;font-size:18px;font-weight:bold;pointer-events:none;text-shadow:0 2px 6px #000;line-height:1.5}
#mute{position:fixed;top:10px;left:10px;min-width:0;padding:6px 12px;font-size:20px;z-index:5;background:#0008;box-shadow:none}
#flash{position:fixed;inset:0;background:radial-gradient(#0000 40%,#ff1744cc);opacity:0;pointer-events:none;transition:opacity .45s}
#toast{position:fixed;left:0;right:0;top:20%;text-align:center;font-size:20px;font-weight:bold;pointer-events:none;opacity:0;transition:opacity .25s;text-shadow:0 2px 8px #000}
</style>

</div>

<script type="module">
import * as THREE from 'three';

const $=id=>document.getElementById(id);
const scoreEl=$('score');
const LANES=[-2.2,0,2.2];
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x2a1f5c);
scene.fog=new THREE.Fog(0x2a1f5c,22,65);
const camera=new THREE.PerspectiveCamera(60,1,0.1,100);
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

{ // yıldızlar ve ay
  const n=350,pos=new Float32Array(n*3);
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,r=60+Math.random()*30;pos[i*3]=Math.cos(a)*r;pos[i*3+1]=8+Math.random()*45;pos[i*3+2]=-Math.abs(Math.sin(a))*r-10}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:0.7,fog:false})));
  const moon=new THREE.Mesh(new THREE.SphereGeometry(7,24,20),new THREE.MeshBasicMaterial({color:0xfff3c4,fog:false}));
  moon.position.set(-22,28,-85);scene.add(moon);
  const halo=new THREE.Mesh(new THREE.SphereGeometry(10,24,20),new THREE.MeshBasicMaterial({color:0xfff3c4,transparent:true,opacity:0.12,fog:false}));
  halo.position.copy(moon.position);scene.add(halo);
}
scene.add(new THREE.HemisphereLight(0xb9a7ff,0x3a3a66,1.0));
const sun=new THREE.DirectionalLight(0xffffff,0.9);
sun.position.set(5,12,6);sun.castShadow=true;
sun.shadow.camera.left=-8;sun.shadow.camera.right=8;sun.shadow.camera.top=12;sun.shadow.camera.bottom=-12;
scene.add(sun);scene.add(sun.target);

// ---- Yol (kayan çizgilerle) ----
const road=new THREE.Mesh(new THREE.PlaneGeometry(7.4,200),new THREE.MeshLambertMaterial({color:0x4a4a68}));
road.rotation.x=-Math.PI/2;road.position.z=-80;road.receiveShadow=true;scene.add(road);
const side=new THREE.Mesh(new THREE.PlaneGeometry(60,200),new THREE.MeshLambertMaterial({color:0x1b5e5a}));
side.rotation.x=-Math.PI/2;side.position.set(0,-0.02,-80);scene.add(side);
const dashes=[];
const dashMat=new THREE.MeshBasicMaterial({color:0x80deea});
for(let i=0;i<30;i++)for(const x of [-1.1,1.1]){
  const d=new THREE.Mesh(new THREE.PlaneGeometry(0.12,1.6),dashMat);
  d.rotation.x=-Math.PI/2;d.position.set(x,0.01,-i*4+10);scene.add(d);dashes.push(d);
}
// kenar ağaçları
const trees=[];
function makeTree(){
  const g=new THREE.Group();
  const t=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.2,1.2),new THREE.MeshLambertMaterial({color:0x7a4a21}));t.position.y=0.6;
  const l=new THREE.Mesh(new THREE.ConeGeometry(0.9,2.2,8),new THREE.MeshLambertMaterial({color:0x7e57c2,emissive:0x311b92}));l.position.y=2.2;
  t.castShadow=l.castShadow=true;g.add(t,l);return g;
}
for(let i=0;i<24;i++){
  const t=makeTree();t.position.set((i%2?1:-1)*(5+Math.random()*4),0,-i*4.5+8);scene.add(t);trees.push(t);
}

// ---- Karakter (daha insansı: yuvarlak uzuvlar, diz-dirsek, saç, yüz, çanta) ----
const mat=(c,o={})=>new THREE.MeshLambertMaterial(Object.assign({color:c},o));
const SKIN=mat(0xf1c27d),SHIRT=mat(0xff7043),JEANS=mat(0x283593),SHOE=mat(0xfafafa),HAIR=mat(0x3e2723),PACK=mat(0x1565c0),PACK2=mat(0x0d47a1),STRIPE=mat(0xffffff);
const M=c=>typeof c==='number'?mat(c):c;
const player=new THREE.Group();
const rig=new THREE.Group();rig.position.y=0.95;player.add(rig);   // kalça noktası
const cast=m=>{m.castShadow=true;return m};
function cap(r,len,color){return cast(new THREE.Mesh(new THREE.CapsuleGeometry(r,len,6,12),M(color)))}
function ball(r,color){return cast(new THREE.Mesh(new THREE.SphereGeometry(r,16,12),M(color)))}
// gövde
const torso=cap(0.27,0.42,SHIRT);torso.position.y=0.55;torso.scale.z=0.78;rig.add(torso);
const stripe=cast(new THREE.Mesh(new THREE.CylinderGeometry(0.285,0.285,0.1,16),STRIPE));
stripe.position.y=0.55;stripe.scale.z=0.78;rig.add(stripe);
const hips=cap(0.25,0.06,JEANS);hips.position.y=0.06;hips.rotation.z=Math.PI/2;hips.scale.set(1,1,0.8);rig.add(hips);
// boyun + kafa
const neck=cast(new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.1,0.14,10),SKIN));neck.position.y=1.0;rig.add(neck);
const headG=new THREE.Group();headG.position.y=1.28;rig.add(headG);
const head=ball(0.26,SKIN);head.scale.set(0.95,1.05,1);headG.add(head);
const hair=ball(0.275,HAIR);hair.scale.set(1,0.95,1);hair.position.set(0,0.06,-0.05);headG.add(hair);
const fringe=ball(0.2,HAIR);fringe.scale.set(1.1,0.45,0.7);fringe.position.set(0,0.2,0.1);headG.add(fringe);
for(const x of[-0.09,0.09]){const e=ball(0.035,0x111111);e.position.set(x,0.02,0.24);headG.add(e)}
const nose=ball(0.03,0xe0a96d);nose.position.set(0,-0.04,0.26);headG.add(nose);
for(const x of[-0.27,0.27]){const ear=ball(0.055,SKIN);ear.position.set(x,0,0);headG.add(ear)}
// sırt çantası (kamera arkadan gördüğü için güzel durur)
const pack=cast(new THREE.Mesh(new THREE.BoxGeometry(0.42,0.55,0.22),PACK));pack.position.set(0,0.55,-0.28);rig.add(pack);
const packTop=cast(new THREE.Mesh(new THREE.BoxGeometry(0.34,0.14,0.2),PACK2));packTop.position.set(0,0.88,-0.28);rig.add(packTop);
// kol: omuz -> dirsek -> el
function makeArm(x){
  const sh=new THREE.Group();sh.position.set(x,0.84,0);rig.add(sh);
  const j=ball(0.14,SHIRT);sh.add(j);
  const up=cap(0.09,0.3,SHIRT);up.position.y=-0.22;sh.add(up);
  const el=new THREE.Group();el.position.y=-0.46;sh.add(el);
  const lo=cap(0.075,0.26,SKIN);lo.position.y=-0.2;el.add(lo);
  const hand=ball(0.09,SKIN);hand.position.y=-0.4;el.add(hand);
  return{sh,el};
}
// bacak: kalça -> diz -> ayak
function makeLeg(x){
  const hip=new THREE.Group();hip.position.set(x,0.05,0);rig.add(hip);
  const th=cap(0.12,0.4,JEANS);th.position.y=-0.3;hip.add(th);
  const kn=new THREE.Group();kn.position.y=-0.6;hip.add(kn);
  const sh=cap(0.1,0.38,JEANS);sh.position.y=-0.27;kn.add(sh);
  const shoe=cast(new THREE.Mesh(new THREE.BoxGeometry(0.2,0.14,0.36),SHOE));shoe.position.set(0,-0.55,0.06);kn.add(shoe);
  const sole=cast(new THREE.Mesh(new THREE.BoxGeometry(0.21,0.05,0.37),mat(0xe53935)));sole.position.set(0,-0.63,0.06);kn.add(sole);
  return{hip,kn};
}
const AL=makeArm(-0.33),AR=makeArm(0.33),LL=makeLeg(-0.16),LR=makeLeg(0.16);
player.rotation.y=Math.PI; // yüz ileri baksın
scene.add(player);

const bx=(w,h,d,c,x=0,y=0,z=0)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);m.castShadow=true;return m};
const cyl=(r,h,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,12),mat(c));m.position.set(x,y,z);m.castShadow=true;return m};
const sph=(r,c,x,y,z,emis)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(r,12,10),new THREE.MeshLambertMaterial({color:c,emissive:emis||0x000000}));m.position.set(x,y,z);return m};
const STONE=0x8d93a8;
const cone=(r,h,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.ConeGeometry(r,h,6),mat(c));m.position.set(x,y,z);m.castShadow=true;return m};

// ---- Ses ----
let actx=null,muted=false,mTimer=null,mStep=0;
function ac(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();return actx}catch(e){return null}}
function tone(f1,f2,dur,type='sine',vol=0.1,delay=0){
  if(muted)return;const a=ac();if(!a)return;
  try{const o=a.createOscillator(),g=a.createGain(),t0=a.currentTime+delay;
  o.type=type;o.frequency.setValueAtTime(f1,t0);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t0+dur);
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+dur+0.02)}catch(e){}
}
function noise(dur,vol,cut){
  if(muted)return;const a=ac();if(!a)return;
  try{const n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource();s.buffer=b;const fl=a.createBiquadFilter();fl.type='lowpass';fl.frequency.value=cut;
  const g=a.createGain();g.gain.value=vol;s.connect(fl);fl.connect(g);g.connect(a.destination);s.start()}catch(e){}
}
const sfx={
  coin:()=>tone(880,1500,0.12,'sine',0.11),
  jump:()=>tone(260,640,0.16,'sine',0.09),
  slide:()=>noise(0.3,0.08,900),
  land:()=>noise(0.12,0.06,400),
  hit:()=>{noise(0.5,0.22,600);tone(170,40,0.5,'square',0.1)},
  power:()=>{for(let i=0;i<3;i++)tone(600+i*260,680+i*260,0.13,'triangle',0.1,i*0.07)},
  shield:()=>tone(900,180,0.35,'sawtooth',0.07)
};
function beep(){sfx.coin()}
const NOTES=[0,3,7,10,12,10,7,3, 0,5,8,12,15,12,8,5];
function musicStep(){
  const f=n=>110*Math.pow(2,n/12);
  const n=NOTES[mStep%NOTES.length];
  tone(f(n+12),f(n+12)*0.99,0.22,'triangle',0.035);
  if(mStep%4===0)tone(f(n-12),f(n-12)*0.98,0.5,'sine',0.07);
  mStep++;
}
function startMusic(){if(muted||mTimer)return;ac();mTimer=setInterval(musicStep,230)}
function stopMusic(){clearInterval(mTimer);mTimer=null}

// ---- Parçacıklar ----
const pGeo=new THREE.BoxGeometry(1,1,1),pMats={};
const pm=c=>pMats[c]||(pMats[c]=new THREE.MeshBasicMaterial({color:c}));
let parts=[];
function burst(x,y,z,color,n,sp,size,up,drift){
  size=size||0.14;up=up||3;drift=drift||0;
  for(let i=0;i<n&&parts.length<260;i++){
    const m=new THREE.Mesh(pGeo,pm(color));const b=size*(0.6+Math.random()*0.8);
    m.scale.setScalar(b);m.position.set(x,y,z);scene.add(m);
    const life=0.45+Math.random()*0.4;
    parts.push({m,b,vx:(Math.random()-0.5)*sp,vy:Math.random()*sp*0.7+up*0.3,vz:(Math.random()-0.5)*sp+drift,life,max:life});
  }
}
function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.life-=dt;
    if(p.life<=0){scene.remove(p.m);parts.splice(i,1);continue}
    p.vy-=9*dt;p.m.position.x+=p.vx*dt;p.m.position.y=Math.max(0.03,p.m.position.y+p.vy*dt);p.m.position.z+=p.vz*dt;
    p.m.scale.setScalar(p.b*p.life/p.max);p.m.rotation.x+=dt*5;p.m.rotation.y+=dt*4;
  }
}
// ---- Ateşböcekleri + hız çizgileri ----
const flies=[],streaks=[];
for(let i=0;i<45;i++){
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.07,8,6),new THREE.MeshBasicMaterial({color:i%2?0xfff59d:0x80deea}));
  const sd=Math.random()<0.5?-1:1;
  m.position.set(sd*(4.4+Math.random()*10),0.6+Math.random()*5,-Math.random()*100+8);
  m.userData={ph:Math.random()*6.28,by:m.position.y};scene.add(m);flies.push(m);
}
for(let i=0;i<14;i++){
  const m=new THREE.Mesh(new THREE.BoxGeometry(0.035,0.035,3),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.22}));
  m.position.set((Math.random()-0.5)*12,0.4+Math.random()*4,-Math.random()*60);m.visible=false;scene.add(m);streaks.push(m);
}

// ---- Kayıt ----
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let totalCoins=ld('tv_coins',0),owned=ld('tv_owned',['klasik']),selected=ld('tv_sel','klasik');

// ---- Kostümler ----
const COSTUMES=[
 {id:'klasik',name:'Klasik',price:0,shirt:0xff7043,jeans:0x283593,hair:0x3e2723,shoe:0xfafafa,pack:0x1565c0,stripe:0xffffff,acc:null},
 {id:'kasif',name:'Kaşif',price:400,shirt:0x6d8b3a,jeans:0x8d6e4a,hair:0x5d4037,shoe:0x5d4037,pack:0xa1887f,stripe:0xffe082,acc:'hat'},
 {id:'ninja',name:'Ninja',price:1200,shirt:0x212121,jeans:0x1a1a1a,hair:0x111111,shoe:0x212121,pack:0x37474f,stripe:0xd32f2f,acc:'band'},
 {id:'astro',name:'Astronot',price:3000,shirt:0xeceff1,jeans:0xcfd8dc,hair:0x3e2723,shoe:0xff7043,pack:0x78909c,stripe:0xff7043,acc:'helmet'},
 {id:'king',name:'Altın Kral',price:7000,shirt:0xffc107,jeans:0xff8f00,hair:0x3e2723,shoe:0xb71c1c,pack:0xb71c1c,stripe:0xffffff,acc:'crown'}
];
const ACC={};
{ // aksesuarlar
  const hat=new THREE.Group();
  const brim=cyl(0.42,0.04,0xa1887f,0,0.2,0);brim.geometry=new THREE.CylinderGeometry(0.42,0.42,0.04,20);
  const top=cyl(0.25,0.22,0x8d6e63,0,0.32,0);top.geometry=new THREE.CylinderGeometry(0.22,0.26,0.22,16);
  const hb=cyl(0.27,0.06,0x4e342e,0,0.26,0);hb.geometry=new THREE.CylinderGeometry(0.265,0.265,0.06,16);
  hat.add(brim,top,hb);
  const band=new THREE.Group();
  const ring=cast(new THREE.Mesh(new THREE.TorusGeometry(0.265,0.035,8,20),mat(0xd32f2f)));ring.rotation.x=Math.PI/2;ring.position.y=0.1;
  const k1=bx(0.06,0.3,0.04,0xd32f2f,0.05,-0.05,-0.3);k1.rotation.z=0.3;
  const k2=bx(0.06,0.3,0.04,0xd32f2f,-0.05,-0.08,-0.3);k2.rotation.z=-0.2;
  band.add(ring,k1,k2);
  const helmet=new THREE.Mesh(new THREE.SphereGeometry(0.37,20,16),new THREE.MeshLambertMaterial({color:0xb3e5fc,transparent:true,opacity:0.28}));
  const crown=new THREE.Group();
  const cb=cyl(0.25,0.12,0xffd54f,0,0.31,0);cb.geometry=new THREE.CylinderGeometry(0.25,0.27,0.12,5);crown.add(cb);
  for(let i=0;i<5;i++){const a=i/5*Math.PI*2;const c=cone(0.06,0.2,0xffd54f,Math.cos(a)*0.22,0.47,Math.sin(a)*0.22);crown.add(c)}
  crown.add(sph(0.045,0xe53935,0,0.32,0.27,0xb71c1c));
  Object.assign(ACC,{hat,band,helmet,crown});
  for(const k in ACC){ACC[k].visible=false;headG.add(ACC[k])}
}
function applyCostume(id){
  const c=COSTUMES.find(x=>x.id===id)||COSTUMES[0];
  SHIRT.color.setHex(c.shirt);JEANS.color.setHex(c.jeans);HAIR.color.setHex(c.hair);SHOE.color.setHex(c.shoe);
  PACK.color.setHex(c.pack);PACK2.color.setHex(c.pack).multiplyScalar(0.75);STRIPE.color.setHex(c.stripe);
  for(const k in ACC)ACC[k].visible=(k===c.acc);
}

// ---- Oyun durumu ----
let state='menu',lane=1,targetX=0,vy=0,y=0,sliding=0,speed=14,score=0,spawnZ=0,t=0,best=ld('tv_best3d',0),runCoins=0,shopOpen=false;
let obstacles=[],coins=[];
// Diken tuzağı (zıpla)
function makeSpikes(){
  const g=new THREE.Group();
  g.add(bx(1.8,0.12,0.95,0x4a4e69,0,0.06,0));

function animateRunner(dt,running){
  t+=dt*(running?9+speed*0.15:0);
  const k=Math.min(1,dt*14);
  const air=y>0.01,sl=sliding>0,dead=state==='over';
  let hipL,hipR,knL,knR,aL,aR,eL,eR,lean=0.12,lift=0;
  if(dead){hipL=-0.5;hipR=0.3;knL=0.6;knR=0.9;aL=-2.6;aR=-2.2;eL=-0.4;eR=-0.4;lean=-1.5;lift=-0.4}
  else if(state==='menu'){hipL=hipR=0;knL=knR=0.05;aL=aR=0.08;eL=eR=-0.25;lean=0.02;lift=Math.sin(performance.now()/500)*0.012}
  else if(sl){hipL=-0.1;hipR=-0.25;knL=0.25;knR=0.55;aL=1.0;aR=0.8;eL=-0.25;eR=-0.25;lean=-1.35;lift=-0.3;headG.rotation.x=0.35}
  else if(air){hipL=-0.9;hipR=0.5;knL=0.4;knR=1.2;aL=-2.4;aR=-2.0;eL=-0.3;eR=-0.3;lean=0.2}
  else{
    const s=Math.sin(t);
    hipL=s*0.95;hipR=-s*0.95;
    knL=Math.max(0,-Math.cos(t))*1.4+0.1;knR=Math.max(0,Math.cos(t))*1.4+0.1;
    aL=-s*0.9;aR=s*0.9;eL=-1.25;eR=-1.25;
    lift=Math.abs(Math.cos(t))*0.09;
    headG.rotation.x=Math.sin(t*2)*0.03;
  }
  if(!sl&&air)headG.rotation.x=0;
  const L=(o,v)=>o.rotation.x+=(v-o.rotation.x)*k;
  L(LL.hip,hipL);L(LR.hip,hipR);L(LL.kn,knL);L(LR.kn,knR);
  L(AL.sh,aL);L(AR.sh,aR);L(AL.el,eL);L(AR.el,eR);
  L(rig,lean);
  rig.position.y+=((0.95+lift)-rig.position.y)*k;
  // kayarken biraz alçal
  rig.position.y=dead?0.45:(sl?0.4:rig.position.y);
}
