<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TapVerse</title>
<style>
html,body{margin:0;height:100%;background:#0b0f1a;color:#fff;font-family:sans-serif;overflow:hidden;touch-action:none;user-select:none}
canvas{display:block}
#ui{position:fixed;top:12px;left:0;right:0;text-align:center;font-size:30px;font-weight:bold;pointer-events:none;text-shadow:0 2px 6px #000}
#msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000a;font-size:22px;text-align:center;line-height:1.5}
#msg b{font-size:42px;margin-bottom:10px}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
</head>
<body>
<div id="ui">0</div>
<div id="msg"><b>TapVerse</b>Başlamak için dokun<br><small>Sağa / sola kaydır: şerit değiştir<br>Yukarı kaydır: zıpla · Aşağı: kay</small></div>
<script type="module">
import * as THREE from 'three';

const ui=document.getElementById('ui'),msg=document.getElementById('msg');
const LANES=[-2.2,0,2.2];
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8fd3ff);
scene.fog=new THREE.Fog(0x8fd3ff,25,70);
const camera=new THREE.PerspectiveCamera(60,1,0.1,100);
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

scene.add(new THREE.HemisphereLight(0xffffff,0x556677,0.9));
const sun=new THREE.DirectionalLight(0xffffff,0.9);
sun.position.set(5,12,6);sun.castShadow=true;
sun.shadow.camera.left=-8;sun.shadow.camera.right=8;sun.shadow.camera.top=12;sun.shadow.camera.bottom=-12;
scene.add(sun);scene.add(sun.target);

// ---- Yol (kayan çizgilerle) ----
const road=new THREE.Mesh(new THREE.PlaneGeometry(7.4,200),new THREE.MeshLambertMaterial({color:0x3a3f4b}));
road.rotation.x=-Math.PI/2;road.position.z=-80;road.receiveShadow=true;scene.add(road);
const side=new THREE.Mesh(new THREE.PlaneGeometry(60,200),new THREE.MeshLambertMaterial({color:0x4caf50}));
side.rotation.x=-Math.PI/2;side.position.set(0,-0.02,-80);scene.add(side);
const dashes=[];
const dashMat=new THREE.MeshBasicMaterial({color:0xffffff});
for(let i=0;i<30;i++)for(const x of [-1.1,1.1]){
  const d=new THREE.Mesh(new THREE.PlaneGeometry(0.12,1.6),dashMat);
  d.rotation.x=-Math.PI/2;d.position.set(x,0.01,-i*4+10);scene.add(d);dashes.push(d);
}
// kenar ağaçları
const trees=[];
function makeTree(){
  const g=new THREE.Group();
  const t=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.2,1.2),new THREE.MeshLambertMaterial({color:0x7a4a21}));t.position.y=0.6;
  const l=new THREE.Mesh(new THREE.ConeGeometry(0.9,2.2,8),new THREE.MeshLambertMaterial({color:0x2e7d32}));l.position.y=2.2;
  t.castShadow=l.castShadow=true;g.add(t,l);return g;
}
for(let i=0;i<24;i++){
  const t=makeTree();t.position.set((i%2?1:-1)*(5+Math.random()*4),0,-i*4.5+8);scene.add(t);trees.push(t);
}

// ---- Karakter (kutulardan 3D insan) ----
const mat=c=>new THREE.MeshLambertMaterial({color:c});
const player=new THREE.Group();
const body=new THREE.Group();player.add(body);
const torso=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.9,0.4),mat(0xff7043));torso.position.y=1.35;
const head=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.5,0.5),mat(0xffcc99));head.position.y=2.08;
const cap=new THREE.Mesh(new THREE.BoxGeometry(0.54,0.18,0.54),mat(0x1565c0));cap.position.y=2.3;
function limb(w,h,color,x,y){
  const pivot=new THREE.Group();pivot.position.set(x,y,0);
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,w),mat(color));m.position.y=-h/2;
  m.castShadow=true;pivot.add(m);return pivot;
}
const armL=limb(0.2,0.8,0xffcc99,-0.48,1.75), armR=limb(0.2,0.8,0xffcc99,0.48,1.75);
const legL=limb(0.26,0.9,0x283593,-0.2,0.95), legR=limb(0.26,0.9,0x283593,0.2,0.95);
[torso,head,cap].forEach(m=>m.castShadow=true);
body.add(torso,head,cap,armL,armR,legL,legR);
player.rotation.y=Math.PI; // yüzü ileri baksın (kamera arkadan görür)
body.rotation.y=0;
scene.add(player);

// ---- Oyun durumu ----
let state='menu',lane=1,targetX=0,vy=0,y=0,sliding=0,speed=14,score=0,spawnZ=0,t=0,best=+localStorage.getItem('tv_best3d')||0;
let obstacles=[];
const boxGeo=new THREE.BoxGeometry(1,1,1);
const MATS={low:mat(0xe53935),high:mat(0xfb8c00),train:mat(0x546e7a)};
function spawnRow(z){
  // 3 şeritten en az biri boş kalsın
  const free=Math.floor(Math.random()*3);
  for(let l=0;l<3;l++){
    if(l===free||Math.random()<0.35)continue;
    const r=Math.random();
    let type=r<0.4?'low':r<0.7?'high':'train';
    let m=new THREE.Mesh(boxGeo,MATS[type]);
    if(type==='low'){m.scale.set(1.8,0.9,0.7);m.position.y=0.45}      // zıpla
    if(type==='high'){m.scale.set(1.8,0.6,0.5);m.position.y=1.7}       // altından kay
    if(type==='train'){m.scale.set(1.9,2.6,5);m.position.y=1.3}        // yan şeride geç
    m.position.x=LANES[l];m.position.z=z;m.castShadow=true;
    m.userData={type,l};scene.add(m);obstacles.push(m);
  }
}
function reset(){
  obstacles.forEach(o=>scene.remove(o));obstacles=[];
  lane=1;targetX=0;player.position.set(0,0,0);y=0;vy=0;sliding=0;speed=14;score=0;spawnZ=-30;
  for(let i=0;i<6;i++){spawnRow(spawnZ);spawnZ-=16}
}
function start(){reset();state='run';msg.style.display='none';last=performance.now()}
function die(){
  state='over';const s=Math.floor(score);
  if(s>best){best=s;try{localStorage.setItem('tv_best3d',best)}catch(e){}}
  msg.innerHTML='<b>Bitti</b>Puan: '+s+'<br>En iyi: '+best+'<br><br><small>Tekrar için dokun</small>';
  msg.style.display='flex';
}

// ---- Kontroller ----
function moveLane(d){if(state!=='run')return;lane=Math.max(0,Math.min(2,lane+d));targetX=LANES[lane]}
function jump(){if(state==='run'&&y<=0.001){vy=9;sliding=0}}
function slide(){if(state==='run'){sliding=0.7;if(y>0)vy=-14}}
let sx=0,sy=0,sdone=false;
addEventListener('pointerdown',e=>{
  if(state!=='run'){if(state==='menu'||state==='over'){start()}return}
  sx=e.clientX;sy=e.clientY;sdone=false;
});
addEventListener('pointermove',e=>{
  if(state!=='run'||sdone)return;
  const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.abs(dx)<30&&Math.abs(dy)<30)return;
  sdone=true;
  if(Math.abs(dx)>Math.abs(dy))moveLane(dx>0?1:-1);
  else if(dy<0)jump();else slide();
});
addEventListener('keydown',e=>{
  if(state!=='run'){if(e.code==='Space'||e.code==='Enter')start();return}
  if(e.code==='ArrowLeft'||e.code==='KeyA')moveLane(-1);
  if(e.code==='ArrowRight'||e.code==='KeyD')moveLane(1);
  if(e.code==='ArrowUp'||e.code==='Space'||e.code==='KeyW')jump();
  if(e.code==='ArrowDown'||e.code==='KeyS')slide();
});

// ---- Döngü ----
let last=performance.now();
function animateRunner(dt,running){
  const f=running?9+speed*0.15:0;
  t+=dt*f;
  const s=Math.sin(t)*0.9;
  if(y>0.01){ // havada
    legL.rotation.x=-0.6;legR.rotation.x=0.4;armL.rotation.x=-2.2;armR.rotation.x=-2.2;
  }else{
    legL.rotation.x=s;legR.rotation.x=-s;armL.rotation.x=-s;armR.rotation.x=s;
  }
  body.position.y=y>0.01?0:Math.abs(Math.cos(t))*0.08;
  // kayarken eğil
  const targetTilt=sliding>0?-1.2:0;
  body.rotation.x+=(targetTilt-body.rotation.x)*Math.min(1,dt*15);
  body.position.z=sliding>0?0.0:0;
  const sy2=sliding>0?0.65:1;
  body.scale.y+=(sy2-body.scale.y)*Math.min(1,dt*15);
}
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min((now-last)/1000,0.05);last=now;
  if(state==='run'){
    speed=Math.min(14+score*0.02,40);   // zamanla hızlanır
    score+=speed*dt*0.7;                // hız arttıkça puan da artar
    // yatay hareket
    player.position.x+=(targetX-player.position.x)*Math.min(1,dt*14);
    // zıplama
    if(y>0||vy>0){vy-=26*dt;y+=vy*dt;if(y<=0){y=0;vy=0}}
    player.position.y=y;
    if(sliding>0)sliding-=dt;
    // dünya akışı
    const dz=speed*dt;
    obstacles.forEach(o=>o.position.z+=dz);
    obstacles=obstacles.filter(o=>{if(o.position.z>8){scene.remove(o);return false}return true});
    spawnZ+=dz;
    while(spawnZ>-90){spawnZ-=Math.max(11,18-speed*0.15);spawnRow(spawnZ+0)}
    dashes.forEach(d=>{d.position.z+=dz;if(d.position.z>12)d.position.z-=120});
    trees.forEach(tr=>{tr.position.z+=dz;if(tr.position.z>10)tr.position.z-=108});
    // çarpışma
    const px=player.position.x,pTop=y+(sliding>0?1.1:2.5),pBot=y;
    for(const o of obstacles){
      const hz=o.scale.z/2+0.25,hx=o.scale.x/2+0.15;
      if(Math.abs(o.position.z)<hz&&Math.abs(o.position.x-px)<hx-0.1){
        const oBot=o.position.y-o.scale.y/2,oTop=o.position.y+o.scale.y/2;
        if(pBot<oTop-0.05&&pTop>oBot+0.05){die();break}
      }
    }
    ui.textContent=Math.floor(score);
  }
  animateRunner(dt,state==='run');
  // kamera
  camera.position.x+=((player.position.x*0.6)-camera.position.x)*Math.min(1,dt*6);
  camera.position.y=4.2;camera.position.z=7;
  camera.lookAt(camera.position.x*0.5,1.5,-6);
  sun.position.set(player.position.x+5,12,6);sun.target.position.set(player.position.x,0,0);
  renderer.render(scene,camera);
}
reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
